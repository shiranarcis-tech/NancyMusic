<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Search for Songs - NancyMusic</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#5b13ec",
              "background-light": "#f6f6f8",
              "background-dark": "#161022",
            },
            fontFamily: {
              "display": ["Spline Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.375rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
      .bg-logo {
        background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 0C8.954 0 0 8.954 0 20C0 31.046 8.954 40 20 40C31.046 40 40 31.046 40 20C40 8.954 31.046 0 20 0Z' fill='%235b13ec' fill-opacity='0.1'/%3E%3C/svg%3E%0A");
        background-size: 50px 50px;
      }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white">
<div class="relative flex min-h-screen w-full flex-col items-center bg-logo p-4 pt-16">
<div class="w-full max-w-4xl space-y-8">
<div class="text-center">
<h1 class="text-5xl font-extrabold text-gray-900 dark:text-white">Search for songs</h1>
</div>
<div class="space-y-6 rounded-xl bg-white dark:bg-[#221933] p-6 shadow-lg">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-[#a492c9]">search</span>
<input class="form-input w-full rounded-lg border-gray-300 bg-background-light p-4 pl-12 text-base font-normal text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-background-dark dark:text-white dark:placeholder:text-[#a492c9] dark:focus:ring-primary" placeholder="Enter song name, artist, album..." type="text"/>
</div>
<div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
<label class="flex flex-col">
<span class="pb-2 text-sm font-medium text-gray-600 dark:text-[#a492c9]">Artist</span>
<input class="form-input w-full rounded-lg border-gray-300 bg-background-light p-3 text-base font-normal text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-background-dark dark:text-white dark:placeholder:text-[#a492c9] dark:focus:ring-primary" placeholder="e.g., The Beatles" type="text"/>
</label>
<label class="flex flex-col">
<span class="pb-2 text-sm font-medium text-gray-600 dark:text-[#a492c9]">Year</span>
<input class="form-input w-full rounded-lg border-gray-300 bg-background-light p-3 text-base font-normal text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-background-dark dark:text-white dark:placeholder:text-[#a492c9] dark:focus:ring-primary" placeholder="e.g., 1969" type="text"/>
</label>
<label class="flex flex-col">
<span class="pb-2 text-sm font-medium text-gray-600 dark:text-[#a492c9]">Song Length</span>
<select class="form-select w-full rounded-lg border-gray-300 bg-background-light p-3 text-base font-normal text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-background-dark dark:text-white dark:focus:ring-primary">
<option>Any</option>
<option>Short (&lt; 3 min)</option>
<option>Medium (3-5 min)</option>
<option>Long (&gt; 5 min)</option>
</select>
</label>
</div>
<div>
<button class="flex w-full items-center justify-center rounded-lg bg-primary px-4 py-3.5 text-base font-bold text-white transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark">
                    Search
                </button>
</div>
</div>
<div class="mt-12">
<h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">Results</h2>
<div class="space-y-4">
<div class="flex items-center justify-between rounded-lg bg-white dark:bg-[#221933] p-4 shadow-md transition-all hover:shadow-lg dark:hover:bg-opacity-80">
<div class="flex items-center gap-4">
<div>
<p class="font-bold text-lg">Here Comes the Sun</p>
<p class="text-sm text-gray-600 dark:text-[#a492c9]">The Beatles</p>
</div>
</div>
<div class="flex items-center gap-4">
<p class="text-sm text-gray-600 dark:text-[#a492c9]">3:05</p>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#443267] focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">play_arrow</span>
</button>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#443267] focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">playlist_add</span>
</button>
</div>
</div>
<div class="flex items-center justify-between rounded-lg bg-white dark:bg-[#221933] p-4 shadow-md transition-all hover:shadow-lg dark:hover:bg-opacity-80">
<div class="flex items-center gap-4">
<div>
<p class="font-bold text-lg">Bohemian Rhapsody</p>
<p class="text-sm text-gray-600 dark:text-[#a492c9]">Queen</p>
</div>
</div>
<div class="flex items-center gap-4">
<p class="text-sm text-gray-600 dark:text-[#a492c9]">5:55</p>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#443267] focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">play_arrow</span>
</button>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#443267] focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">playlist_add</span>
</button>
</div>
</div>
<div class="flex items-center justify-between rounded-lg bg-white dark:bg-[#221933] p-4 shadow-md transition-all hover:shadow-lg dark:hover:bg-opacity-80">
<div class="flex items-center gap-4">
<div>
<p class="font-bold text-lg">Smells Like Teen Spirit</p>
<p class="text-sm text-gray-600 dark:text-[#a492c9]">Nirvana</p>
</div>
</div>
<div class="flex items-center gap-4">
<p class="text-sm text-gray-600 dark:text-[#a492c9]">5:01</p>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#443267] focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">play_arrow</span>
</button>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#443267] focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">playlist_add</span>
</button>
</div>
</div>
<div class="flex items-center justify-between rounded-lg bg-white dark:bg-[#221933] p-4 shadow-md transition-all hover:shadow-lg dark:hover:bg-opacity-80">
<div class="flex items-center gap-4">
<div>
<p class="font-bold text-lg">Like a Rolling Stone</p>
<p class="text-sm text-gray-600 dark:text-[#a492c9]">Bob Dylan</p>
</div>
</div>
<div class="flex items-center gap-4">
<p class="text-sm text-gray-600 dark:text-[#a492c9]">6:13</p>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#443267] focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">play_arrow</span>
</button>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-[#443267] focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">playlist_add</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>

</body></html>
