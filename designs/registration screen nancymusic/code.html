<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join NancyMusic</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#5b13ec",
              "background-light": "#f6f6f8",
              "background-dark": "#161022",
            },
            fontFamily: {
              "display": ["Spline Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
      .bg-logo {
        background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 0C8.954 0 0 8.954 0 20C0 31.046 8.954 40 20 40C31.046 40 40 31.046 40 20C40 8.954 31.046 0 20 0Z' fill='%235b13ec' fill-opacity='0.1'/%3E%3C/svg%3E%0A");
        background-size: 50px 50px;
      }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-logo p-4">
<div class="w-full max-w-md space-y-8">
<div class="text-center">
<h1 class="text-4xl font-black text-gray-900 dark:text-white transition-transform duration-300 hover:scale-105 cursor-pointer">Join NancyMusic</h1>
<p class="mt-2 text-base text-gray-600 dark:text-[#a492c9]">Create an account to start enjoying music from all over the world.</p>
</div>
<div class="space-y-6">
<div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-gray-900 dark:text-white">First Name</p>
<input class="form-input flex w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 bg-white p-3.5 text-base font-normal text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-[#221933] dark:text-white dark:placeholder:text-[#a492c9] dark:focus:ring-primary" placeholder="Enter your first name" value=""/>
</label>
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-gray-900 dark:text-white">Last Name</p>
<input class="form-input flex w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 bg-white p-3.5 text-base font-normal text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-[#221933] dark:text-white dark:placeholder:text-[#a492c9] dark:focus:ring-primary" placeholder="Enter your last name" value=""/>
</label>
</div>
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-gray-900 dark:text-white">Username</p>
<input class="form-input flex w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 bg-white p-3.5 text-base font-normal text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-[#221933] dark:text-white dark:placeholder:text-[#a492c9] dark:focus:ring-primary" placeholder="Enter your username" value=""/>
</label>
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-gray-900 dark:text-white">Email Address</p>
<input class="form-input flex w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 bg-white p-3.5 text-base font-normal text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-[#221933] dark:text-white dark:placeholder:text-[#a492c9] dark:focus:ring-primary" placeholder="Enter your email address" type="email" value=""/>
</label>
<div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-gray-900 dark:text-white">Password</p>
<input class="form-input flex w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 bg-white p-3.5 text-base font-normal text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-[#221933] dark:text-white dark:placeholder:text-[#a492c9] dark:focus:ring-primary" placeholder="Enter your password" type="password" value=""/>
</label>
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-gray-900 dark:text-white">Verify Password</p>
<input class="form-input flex w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-300 bg-white p-3.5 text-base font-normal text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary dark:border-[#443267] dark:bg-[#221933] dark:text-white dark:placeholder:text-[#a492c9] dark:focus:ring-primary" placeholder="Confirm your password" type="password" value=""/>
</label>
</div>
</div>
<div>
<button class="flex w-full items-center justify-center rounded-lg bg-primary px-4 py-3.5 text-base font-bold text-white transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark">
                    Create Account
                </button>
</div>
<div class="text-center">
<p class="text-sm text-gray-600 dark:text-gray-400">
                    Already have an account?
                    <a class="font-medium text-primary hover:underline" href="#">Log in</a>
</p>
</div>
</div>
</div>
</body></html>
