<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Now Playing - NancyMusic</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#5b13ec",
            "background-light": "#f6f6f8",
            "background-dark": "#161022",
          },
          fontFamily: {
            "display": ["Spline Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.375rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4">
<div class="w-full max-w-md space-y-6">
<div class="flex flex-col items-center space-y-6">
<img alt="Album cover" class="h-80 w-80 rounded-xl object-cover shadow-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrkC4P3V2t9F5U5YKkZcnZUu5x14Kl-LInY1P0DRbgfPNsEyV28VC9ZvjBR0nofkwAArsMd8cm90Sttq77ENN06XzwlwAzqaCf31zEFLI-Xn0OmLxd_yvU4AljWKb_voU5Uz5f5cfNLmLbwJT3Gavr-BXJqBNohOfxF1_My3EgM9CXQGiftxF4lOyvKP5taEUcmEZl3btOTb-pc-HY1Hv6eKdC9LAEOS1Oi5XzpvC2MqnKijH8P4nZQJSYFrJoWAOOyUCnBHfzfsY"/>
<div class="text-center">
<h1 class="text-4xl font-extrabold text-gray-900 dark:text-white">Starlight Serenade</h1>
<p class="text-lg text-gray-600 dark:text-gray-300">Cosmic Echoes</p>
<p class="text-sm text-gray-500 dark:text-gray-400">2023</p>
</div>
</div>
<div class="space-y-4">
<div class="space-y-1">
<div class="relative h-2 rounded-full bg-gray-300 dark:bg-gray-700">
<div class="absolute h-2 w-1/2 rounded-full bg-primary"></div>
</div>
<div class="flex justify-between text-xs font-medium text-gray-500 dark:text-gray-400">
<span>1:42</span>
<span>3:45</span>
</div>
</div>
<div class="flex items-center justify-center space-x-6">
<button class="text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">
<span class="material-symbols-outlined text-4xl">skip_previous</span>
</button>
<button class="flex h-16 w-16 items-center justify-center rounded-full bg-primary text-white shadow-lg transition-transform hover:scale-105">
<span class="material-symbols-outlined text-5xl">pause</span>
</button>
<button class="text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">
<span class="material-symbols-outlined text-4xl">skip_next</span>
</button>
</div>
</div>
<div class="flex items-center justify-center space-x-8 pt-4">
<button class="text-gray-600 hover:text-primary dark:text-gray-400 dark:hover:text-primary">
<span class="material-symbols-outlined">playlist_add</span>
</button>
<button class="text-gray-600 hover:text-red-500 dark:text-gray-400 dark:hover:text-red-400">
<span class="material-symbols-outlined">favorite_border</span>
</button>
</div>
</div>
</div>

</body></html>
